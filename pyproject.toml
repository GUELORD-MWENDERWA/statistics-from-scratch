[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "statlab"
version = "0.1.0"
description = "Statistics from first principles: descriptive statistics, probability distributions, confidence intervals, hypothesis tests and regression inference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Guelord Mwenderwa" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=7", "scipy>=1.10", "numpy>=1.24"]

[tool.setuptools.packages.find]
where = ["src"]
